[project]
name = "divya-ingest"
version = "0.1.0"
description = "Divya Drishti ingest: WebRTC camera nodes -> decoded, timestamped, quality-scored frames"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "aiortc>=1.9",
    "av>=12",
    "opencv-python-headless>=4.10",
    "numpy>=1.26",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "websockets>=13",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
